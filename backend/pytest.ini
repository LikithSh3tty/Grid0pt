[pytest]
# -n auto runs the suite across cores. It is a default rather than an option
# because of what this suite spends its time on: the certificates each run a
# branch and bound to closure, which took the whole suite from twelve minutes
# to thirty as they were added. Serial, that is long enough to change how the
# code gets worked on.
#
# Safe to parallelise here because the tests share no state that survives a
# process: xdist gives each worker its own interpreter, so the service's result
# cache and the packers' counters are per-worker rather than shared.
#
# Run serially with `-n 0` when a failure needs a readable traceback. Not
# `-p no:xdist`, which unloads the plugin that supplies -n and makes the line
# below an unrecognised argument.
addopts = -n auto
testpaths = tests
